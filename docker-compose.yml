version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kms_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  redis:
    image: redis:alpine
    container_name: kms_redis
    ports:
      - "6379:6379"
    restart: always

  minio:
    image: minio/minio
    container_name: kms_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  qdrant_data:
  minio_data: