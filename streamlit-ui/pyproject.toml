[project]
name = "streamlit-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darsh Bhesaniya", email = "darshbhesaniya8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.7.2",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

[project.scripts]
streamlit-ui = "streamlit_ui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
